<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | QuickHire</title><link rel="stylesheet" href="{{ url_for('static', filename='css/careers.css') }}"></head><body>{% set active_page = 'profile' %}{% include 'careers/_navigation.html' %}
<main><section class="candidate-welcome"><div><span class="eyebrow">PROFILE</span><h1>Your profile</h1><p>Keep your contact details, headline and skills up to date for future applications.</p></div></section><div class="profile-shell"><form class="profile-card" method="post"><div class="profile-avatar">{{ account.full_name[:1]|upper }}</div><div class="profile-form-grid"><label>Full name<input name="name" value="{{ account.full_name }}" required></label><label>Email address<input value="{{ account.email }}" disabled><small>Verified sign-in email</small></label><label>Mobile number<input name="phone" value="{{ account.phone or '' }}" placeholder="04XX XXX XXX"></label><label>Location<input name="location" value="{{ account.location or '' }}" placeholder="Sydney, NSW"></label><label class="full">Professional headline<input name="headline" value="{{ account.headline or '' }}" placeholder="e.g. IT Support Specialist"></label><label class="full">Skills<textarea name="skills" rows="5" placeholder="Python, Networking, AWS, SQL">{{ account.skills or '' }}</textarea><small>Separate skills with commas.</small></label></div><div class="profile-actions"><button class="button" type="submit">Save changes</button><a class="secondary-button" href="{{ url_for('candidate_auth.dashboard') }}">My applications</a></div></form></div></main><footer>QuickHire · Your career, in one place</footer></body></html>
