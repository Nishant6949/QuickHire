<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - QuickHire</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <a href="{{ url_for('landing.index') }}" class="auth-brand">QuickHire</a>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-form active">
                <h2 class="auth-header">Forgot Password</h2>
                <p style="color: #A1A1AA; font-size: 14px; margin-bottom: 24px; text-align: center;">Enter your work email and we'll send you a reset link.</p>

                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div style="background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;">
                    {% for message in messages %}
                    <p style="color: #A1A1AA; font-size: 13px; margin: 0;">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('password_reset.forgot_password') }}">
                    <div class="form-group">
                        <label for="email">Work Email</label>
                        <input type="email" name="email" id="email" placeholder="you@company.com" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Send Reset Link</button>
                    <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
                </form>
            </div>

            <a href="{{ url_for('landing.index') }}" class="back-btn">
                <i data-feather="arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>if (window.feather) feather.replace();</script>
</body>
</html>
