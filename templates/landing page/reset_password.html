<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - QuickHire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <a href="{{ url_for('landing.index') }}" class="auth-brand">QuickHire</a>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-form active">
                <h2 class="auth-header">Reset Password</h2>
                <p style="color: #A1A1AA; font-size: 14px; margin-bottom: 24px; text-align: center;">Choose a new password for your account.</p>

                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div style="background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;">
                    {% for message in messages %}
                    <p style="color: #EF4444; font-size: 13px; margin: 0;">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('password_reset.reset_password', token=token) }}">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <div class="password-wrapper" id="new-password-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="new-password-toggle" aria-label="Toggle password visibility" tabindex="-1">
                                <i data-feather="eye" class="icon-visible" aria-hidden="true"></i>
                                <i data-feather="eye-off" class="icon-hidden" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-wrapper" id="confirm-password-wrapper">
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="confirm-password-toggle" aria-label="Toggle password visibility" tabindex="-1">
                                <i data-feather="eye" class="icon-visible" aria-hidden="true"></i>
                                <i data-feather="eye-off" class="icon-hidden" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Reset Password</button>
                    <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to Sign In</a></p>
                </form>
            </div>

            <a href="{{ url_for('landing.index') }}" class="back-btn">
                <i data-feather="arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.feather) feather.replace();

        function setupToggle(wrapperId, inputId, toggleId) {
            const wrapper = document.getElementById(wrapperId);
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);
            if (wrapper && input && toggle) {
                toggle.addEventListener('click', () => {
                    const isVisible = wrapper.classList.toggle('is-visible');
                    input.type = isVisible ? 'text' : 'password';
                });
            }
        }

        setupToggle('new-password-wrapper', 'password', 'new-password-toggle');
        setupToggle('confirm-password-wrapper', 'confirm-password', 'confirm-password-toggle');
    });
    </script>
</body>
</html>
