<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - QuickHire</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body>
    <a href="{{ url_for('landing.index') }}" class="auth-brand">QuickHire</a>

    <div class="auth-container">
        <div class="auth-card">
            <div id="login-form" class="auth-form active">
                <h2 class="auth-header">Welcome Back</h2>

                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div style="background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;">
                    {% for message in messages %}
                    <p style="color: #EF4444; font-size: 13px; margin: 0;">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}

                <form id="login-form-element" method = "POST" action = "{{ url_for('auth.login')}}">
                    <div class="form-group">
                        <label for="login-email">Work Email</label>
                        <input type="email" name = "login-email" id="login-email" placeholder="you@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-wrapper" id="login-password-wrapper">
                            <input type="password" id="login-password" name = "login-password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle" id="login-password-toggle" aria-label="Toggle password visibility" tabindex="-1">
                                <i data-feather="eye" class="icon-visible" aria-hidden="true"></i>
                                <i data-feather="eye-off" class="icon-hidden" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary btn-full" id="login-btn">
                        <span id="login-text">Sign In</span>
                        <span id="login-spinner" class="spinner" style="display: none;"></span>
                    </button>
                    <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.register') }}" id="switch-to-register">Sign Up</a></p>
                    <p class="auth-switch"><a href="{{ url_for('password_reset.forgot_password') }}">Forgot password?</a></p>
                </form>
            </div> 

            <a href="{{ url_for('landing.index') }}" class="back-btn">
                <i data-feather="arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
